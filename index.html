// Activity top, Fitbit-style: the weekly intensity ring on the left, three stacked tiles on the right — each a large tap target.
// Calories show fact / plan (plan = average daily burn over the last 4 weeks); the load status word is green inside 0.8–1.3, orange outside.
function actTop(){const nw=($('#phone')||document.body).clientWidth<390,wk=VV.intWeek(0),today=VV.intDay(0),d=nw?150:180,w=14,r=(d-w)/2,c=2*Math.PI*r,p=Math.min(1,wk/150);
const ringSvg=`<svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" style="display:block">
 <defs><path id="arcT" d="M ${d/2-r+w+12} ${d/2} A ${r-w-12} ${r-w-12} 0 0 1 ${d/2+r-w-12} ${d/2}"/></defs>
 <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="var(--div)" stroke-width="${w}"/>
 <circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="var(--tx)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 ${d/2} ${d/2})"/>
 <text font-size="12" fill="var(--tx2)" font-family="var(--f)" letter-spacing=".5"><textPath href="#arcT" startOffset="50%" text-anchor="middle">${nw?'Интенсивность':'Интенсивность · 7 дней'}</textPath></text></svg>`;
const kplan=(()=>{const f=PCFG.kcal.dailyTot,a=[];if(f)for(let k=1;k<=28;k++){const v=f(k);if(v)a.push(v)}return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length/10)*10:2900})();
const tile=(icon,t,v,u,go,acc,pr,pc)=>`<div class="g ${acc?'acc':''} tap row" data-go="${go}" style="border-radius:28px;padding:8px 14px 8px 8px;gap:10px;height:62px"><span class="g" style="width:${nw?38:46}px;height:${nw?38:46}px;border-radius:23px;display:grid;place-items:center;flex:none;${acc?'color:var(--mark)':''}">${ic(icon,22)}</span><div style="min-width:0;flex:1"><div class="mic" style="color:var(--tx2)">${t}</div><div class="row" style="gap:4px;align-items:baseline"><span class="num" style="font-size:24px">${v}</span><span class="mic" style="white-space:nowrap">${u}</span></div>${pr!=null?`<div style="height:3px;border-radius:2px;background:var(--div);margin-top:3px"><i style="display:block;height:100%;width:${Math.min(100,pr*100)}%;border-radius:2px;background:${pc}"></i></div>`:''}</div></div>`;
return `<div class="row" style="margin-top:14px;gap:10px;align-items:center">
 <div class="tap" data-go="intense" style="position:relative;width:${d}px;height:${d}px;flex:none">${ringSvg}<div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div style="margin-top:10px"><div class="num" style="font-size:${nw?40:48}px;line-height:1">${wk}</div><div class="mic">из 150 мин</div><div class="mic" style="display:inline-block;margin-top:8px;padding:3px 10px;border-radius:12px;background:var(--glass2);color:var(--mark)">+${today} сегодня</div></div></div></div>
 <div class="stack" style="flex:1;min-width:0;gap:8px">${tile('run','Шаги',nf(VV.steps),'/ '+nf(VV.stepsGoal||8000),'steps',1,VV.steps/(VV.stepsGoal||8000),'var(--mark)')}${tile('pulse','Расход, ккал',nf(VV.kcal),'/ '+nf(kplan),'kcal',0,VV.kcal/kplan,'var(--high)')}${tile('dumb','Нагрузка',VV.load.peak,(()=>{const r=VV.load.ratio,out=r>1.3||r<.8;return `<span class="${out?'med':'good'}">${r>1.3?'высокая':r<.8?'низкая':'оптимум'}</span>`})(),'load')}</div></div>`;
}

function gauge(m,size=220){const cx=size/2,r=size/2-14,w=10,A=a=>{const t=a*Math.PI/180;return [cx+r*Math.sin(t),cx-r*Math.cos(t)]},ang=v=>210+(Math.min(Math.max(v,m.mn),m.mx)-m.mn)/(m.mx-m.mn)*300;
 const arc=(a0,a1)=>{const [x0,y0]=A(a0),[x1,y1]=A(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`};
 const segs=m.segs.map(sg=>`<path d="${arc(ang(sg[0])+1.2,ang(sg[1])-1.2)}" stroke="var(--${sg[2]})" stroke-width="${w}" fill="none" stroke-linecap="butt" opacity=".9"/>`).join('');
 const [mx2,my2]=A(ang(m.v)),cur=m.segs.find(s=>m.v>=s[0]&&m.v<=s[1])||m.segs[0];
 return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px;display:block;margin:0 auto">${segs}<circle cx="${mx2.toFixed(1)}" cy="${my2.toFixed(1)}" r="9" fill="var(--bottom)" stroke="var(--tx)" stroke-width="3"/><text x="${cx}" y="${cx+8}" text-anchor="middle" font-size="${m.label?26:52}" font-weight="200" fill="var(--tx)" font-family="var(--f)">${m.label||m.v.toLocaleString('ru')}</text><text x="${cx}" y="${cx+34}" text-anchor="middle" font-size="13" fill="var(--tx2)" font-family="var(--f)">${cur[3]}</text><text x="${cx}" y="${size-6}" text-anchor="middle" font-size="11" fill="var(--tx3)" font-family="var(--f)">${m.u}</text></svg>`}
const miniGauge=m=>{const s=86,cx=s/2,r=s/2-7,A=a=>{const t=a*Math.PI/180;return [cx+r*Math.sin(t),cx-r*Math.cos(t)]},ang=v=>210+(Math.min(Math.max(v,m.mn),m.mx)-m.mn)/(m.mx-m.mn)*300,arc=(a0,a1)=>{const [x0,y0]=A(a0),[x1,y1]=A(a1);return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`},[px,py]=A(ang(m.v));
 return `<svg viewBox="0 0 ${s} ${s}" style="width:${s}px;height:${s}px">${m.segs.map(sg=>`<path d="${arc(ang(sg[0])+2,ang(sg[1])-2)}" stroke="var(--${sg[2]})" stroke-width="5" fill="none" opacity=".9"/>`).join('')}<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="5" fill="var(--bottom)" stroke="var(--tx)" stroke-width="2"/><text x="${cx}" y="${cx+6}" text-anchor="middle" font-size="${m.label?11:20}" font-weight="300" fill="var(--tx)" font-family="var(--f)">${m.label||m.v.toLocaleString('ru')}</text></svg>`};

 els.forEach((e,i)=>{e._tf=1;const [f,w]=cs[i],svg=e instanceof SVGElement,kk=svg?Math.min(k,1.25):f<=20?k:f<34?1+(k-1)/2:1;if(kk!==1)e.style.fontSize=(f*kk).toFixed(1)+'px';if(dw&&e.childNodes.length&&[...e.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))e.style.fontWeight=Math.max(100,Math.min(700,w+dw))})}
