<style>
/* Layout: one-screen phone app — fixed gradient backdrop, scrolling content, floating glass tab bar. Theme set by the app itself (Синяя / Зелёная / Металл). */
:root{
  --top:#2F4180;--mid:#152452;--bottom:#04070F;--cloud:#6878B4;--hl:#8C98C8;
  --glass:rgba(255,255,255,.08);--glass2:rgba(255,255,255,.13);--stroke:rgba(255,255,255,.22);--stroke2:rgba(255,255,255,.4);
  --tx:#fff;--tx2:rgba(255,255,255,.62);--tx3:rgba(255,255,255,.42);--div:rgba(255,255,255,.14);
  --lime:#E7FF51;--mark:#E7FF51;--onlime:#0C0D0F;--knob:#E7FF51;--knobi:#0C0D0F;--link:#E7FF51;--bar:rgba(11,21,48,.55);
  --low:#FF6B5E;--med:#FFB547;--good:#5ED6A0;--high:#9FE3FF;
  --deep:#070B20;--light:#2A5EB0;--rem:#1E2361;--awake:#E7FF51;--hdr:#2C4FAE;
  --f:"Geist",-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-app="forest"]{--top:#3D5C4A;--mid:#1B2E23;--bottom:#050906;--cloud:#6E8C78;--hl:#93AE9A;--bar:rgba(12,22,16,.55);--deep:#2B2F8F;--light:#1C8C93;--rem:#4FE3CF;--hdr:#2E4A3A}
:root[data-app="metal"]{--top:#F9F9FA;--mid:#E6E8EB;--bottom:#D6D9DE;--cloud:#fff;--hl:#fff;
  --glass:rgba(255,255,255,.62);--glass2:rgba(255,255,255,.85);--stroke:rgba(255,255,255,.95);--stroke2:#fff;
  --tx:#0B1530;--tx2:rgba(11,21,48,.62);--tx3:rgba(11,21,48,.42);--div:rgba(11,21,48,.1);
  --lime:#24408A;--mark:#7D9400;--onlime:#E7FF51;--knob:#24408A;--knobi:#E7FF51;--link:#24408A;--bar:rgba(255,255,255,.75);
  --high:#2E7FD6;--awake:#7D9400;--hdr:#1B2F66;color-scheme:light}
html,body{height:var(--appH,100%);overflow:hidden;background:var(--bottom);color:var(--tx);font-family:var(--f)}
body{overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.stage{position:absolute;top:0;left:0;right:0;height:var(--appH,100%);display:flex;justify-content:center;background:#05070c}
.phone{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;background:var(--bottom)}
@media(min-width:600px){.stage{align-items:center}.phone{height:min(932px,96vh);border-radius:48px;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--top) 0%,var(--mid) 52%,var(--bottom) 100%)}
.bg::before{content:"";position:absolute;width:120%;height:46%;left:-10%;top:4%;background:radial-gradient(closest-side,var(--cloud),transparent);opacity:.55;filter:blur(30px)}
.bg::after{content:"";position:absolute;width:80%;height:30%;right:-15%;top:26%;background:radial-gradient(closest-side,var(--hl),transparent);opacity:.4;filter:blur(30px)}
:root[data-app="metal"] .bg{background:linear-gradient(135deg,#F9F9FA 0%,#E1E3E7 30%,#F4F5F7 52%,#D6D9DE 78%,#ECEDF0 100%)}
:root[data-app="metal"] .bg::before{opacity:.9}
.grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.13;pointer-events:none}
.scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.scroll::-webkit-scrollbar{display:none}
.screen{animation:in .28s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}}
/* type */
.disp{font-weight:100;letter-spacing:-.04em;line-height:.95}
.h1{font-size:34px;font-weight:200;letter-spacing:-.03em}
.h2{font-size:22px;font-weight:300;letter-spacing:-.02em}
.h3{font-size:17px;font-weight:400}
.b{font-size:14px;font-weight:300;line-height:1.4}
.bs{font-size:14px;font-weight:400}
.cap{font-size:12px;font-weight:300;color:var(--tx2)}
.mic{font-size:11px;font-weight:300;color:var(--tx3)}
.over{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
.num{font-weight:100;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.c2{color:var(--tx2)}.c3{color:var(--tx3)}.mark{color:var(--mark)}.good{color:var(--good)}.med{color:var(--med)}.lowc{color:var(--low)}.hi{color:var(--high)}
/* glass */
.g{background:var(--glass);border:1px solid var(--stroke);border-radius:28px;backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);box-shadow:0 14px 34px rgba(0,0,8,.28),inset 0 1px 0 rgba(255,255,255,.35)}
:root[data-app="metal"] .g{box-shadow:0 10px 26px rgba(11,21,48,.1),inset 0 1px 0 #fff}
.g.acc{border-color:var(--mark)}.g.warn{border-color:var(--med)}.g.bad{border-color:var(--low)}
.pad{padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec{margin-top:26px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tap{cursor:pointer;transition:transform .12s}.tap:active{transform:scale(.98)}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;height:60px;margin-bottom:8px}
.cb{width:52px;height:52px;border-radius:26px;display:grid;place-items:center;position:relative}
.cb.on{border-color:var(--mark)}
.badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:var(--lime);color:var(--onlime);font-size:10px;font-weight:600;display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* buttons */
.btnL{height:56px;border-radius:28px;background:var(--lime);color:var(--onlime);display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:400;box-shadow:0 6px 14px rgba(0,0,0,.3)}
.btnG{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:300}
.chip{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:17px;background:var(--glass);border:1px solid var(--stroke);font-size:13px;font-weight:300;white-space:nowrap}
.chip.on{border-color:var(--mark);color:var(--tx)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;padding:4px;border-radius:20px;gap:2px}
.seg button{flex:1;height:32px;border-radius:16px;font-size:13px;font-weight:300;color:var(--tx2)}
.seg button.on{background:var(--glass2);color:var(--tx);font-weight:400}
/* slider */
.slider{position:relative;height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:300;touch-action:none;user-select:none}
.knob{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:24px;background:var(--knob);color:var(--knobi);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.35)}
/* tab bar */
.phone::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 70px);background:linear-gradient(180deg,transparent,var(--bottom) 85%);pointer-events:none;z-index:19}
.tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,calc(env(safe-area-inset-bottom,0px) - 8px));width:min(354px,calc(100% - 32px));height:64px;border-radius:32px;display:flex;align-items:center;justify-content:space-around;background:var(--bar);border:1px solid var(--stroke);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);z-index:20}
.tab{width:52px;height:52px;display:grid;place-items:center;position:relative;opacity:.45}
.tab.on{opacity:1}.tab.on::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:2px;background:var(--mark)}
.plus{width:48px;height:48px;border-radius:24px;background:var(--lime);color:var(--onlime);display:grid;place-items:center;box-shadow:0 6px 14px rgba(0,0,0,.35)}
:root[data-app="metal"] .plus svg{color:#E7FF51}
/* sheet */
.veil{position:absolute;inset:0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(0,0,0,.2);z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);max-height:88%;overflow-y:auto;border-radius:40px;padding:12px 18px 22px;z-index:31;background:var(--glass2);animation:up .3s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--tx3);margin:0 auto 14px}
/* plan */
.plan{position:relative;padding-left:34px}
.plan::before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:1px;background:var(--div)}
.glint{stroke:#fff;opacity:0;filter:drop-shadow(0 0 6px rgba(255,255,255,.9));animation:glint 5s ease-in-out 1.2s infinite}
@keyframes glint{0%{stroke-dashoffset:0;opacity:0}3%{opacity:.95}17%{opacity:.95}22%{stroke-dashoffset:var(--e);opacity:0}100%{stroke-dashoffset:var(--e);opacity:0}}
@media(prefers-reduced-motion:reduce){.glint{animation:none}}
.pi{position:relative;display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px}
.pi .dot{position:absolute;left:-28px;width:16px;height:16px;border-radius:8px;border:1.5px solid var(--tx3);background:var(--bottom)}
.pi.done .dot{background:var(--tx3);border-color:var(--tx3)}
.pi.now{background:var(--glass2);border:1px solid var(--stroke);border-radius:20px;padding:10px 12px;margin:4px 0}
.pi.now .dot{left:-34px;border-color:var(--mark);border-width:4px}
.pi.done .t{color:var(--tx3)}
.chk{margin-left:auto;width:40px;height:40px;border-radius:20px;background:var(--knob);color:var(--knobi);display:grid;place-items:center}
.ava{width:28px;height:28px;border-radius:14px;border:1.2px solid var(--mark);display:grid;place-items:center;font-size:10px;font-weight:500;background:var(--glass2);flex:none}
/* advisor */
.norma{width:28px;height:28px;border-radius:14px;background:var(--lime);color:var(--onlime);display:grid;place-items:center;flex:none}
:root[data-app="metal"] .norma{color:#E7FF51}
.toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:50;padding:12px 18px;border-radius:22px;font-size:13px;white-space:nowrap;animation:fade .2s}
.bar{height:4px;border-radius:2px;background:var(--div);position:relative;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--mark)}
.hr{height:1px;background:var(--div)}
.toggle{width:48px;height:28px;border-radius:14px;background:var(--glass2);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:var(--tx2);transition:left .2s}
.toggle.on{background:var(--lime)}.toggle.on::after{left:22px;background:var(--onlime)}
.photo{border-radius:18px;background:radial-gradient(circle at 40% 40%,#c9a26b,#6b4a2b 45%,#1c2238 70%);position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e9c58b 0,#9fbf6a 30%,#6d8f3c 55%,#3a2a1f 80%)}
.photo.sal{background:radial-gradient(circle at 50% 50%,#2a3350,#0c1020 70%)}.photo.sal::after{background:radial-gradient(circle at 40% 40%,#f29a6b 0,#e36f3f 30%,#6d8f3c 60%,#1c2238 85%)}
.photo.oat{background:radial-gradient(circle at 50% 50%,#2a3350,#0c1020 70%)}.photo.oat::after{background:radial-gradient(circle at 40% 40%,#efe0c4 0,#d7bf92 40%,#5b6fb8 62%,#1c2238 85%)}
.photo.sport{background:linear-gradient(160deg,#2b3b72,#0b1124)}.photo.sport::after{inset:30% 35% 10% 35%;border-radius:40% 40% 10% 10%;background:linear-gradient(#cfd6ea,#5a678f)}
.focus{display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:20px}
.track .ln{position:absolute;left:0;right:0;top:9px;height:2px;background:var(--div)}
.track .tg{position:absolute;top:0;height:20px;border:1px dashed var(--tx2);border-radius:6px}
.track .fact{position:absolute;left:0;top:5px;height:10px;border-radius:5px}
</style>

<script>(function(){const f=()=>{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)document.documentElement.style.setProperty('--appH',Math.max(innerHeight,screen.height)+'px')};f();addEventListener('resize',f)})()</script>

<script>
const $=s=>document.querySelector(s);
const I={
 cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 bowl:'<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M9 4c0 1.5 1 1.5 1 3M13 4c0 1.5 1 1.5 1 3"/>',

 cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',drop:'<path d="M12 3s-6 7-6 11.5a6 6 0 0 0 12 0C18 10 12 3 12 3Z"/>',

 watch:'<rect x="7" y="6" width="10" height="12" rx="3"/><path d="M9 6l.5-3h5l.5 3M9 18l.5 3h5l.5-3"/>',lock:'<rect x="5" y="10.5" width="14" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/>',mail:'<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="m4 7.5 8 6 8-6"/>'};
const ic=(n,s=22)=>`<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px">${I[n]}</svg>`;

// ---------- state ----------
const st={tab:'today',stack:[],theme:'blue',water:1.2,eaten:1420,goal:2100,advQ:[
  {id:'snore',sec:'Сегодня',q:'Ты храпишь во сне?',sub:'5 ночей подряд по 6–9 пробуждений',a:['Да','Иногда','Нет','Не знаю']},

  plan:[{s:'pin',t:'Без десертов сегодня',sub:'Захочется сладкого — кусок хлеба или фрукт. Цель Потенциала: −4 кг за 8 недель'},

  liked:{},showMe:true,caseStep:1,portions:[160,150,60,80],workout:null};
try{const s=JSON.parse(localStorage.getItem('vitals-proto')||'{}');if(s.theme)st.theme=s.theme;}catch(e){}
const save=()=>{try{localStorage.setItem('vitals-proto',JSON.stringify({theme:st.theme}))}catch(e){}};
function applyTheme(){document.documentElement.dataset.app=st.theme==='blue'?'':st.theme;if(st.theme==='blue')delete document.documentElement.dataset.app;}

// ---------- helpers ----------
// Readiness ring with a light glint running along the arc every 5 s — the hint that the ring opens «Факторы».
function glintRing(d,w,p,col){const r=(d-w)/2,c=2*Math.PI*r,len=c*p,seg=34;return ring(d,w,p,col).replace('</svg>',`<circle class="glint" cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${seg} ${c}" style="--e:${-(len-seg)}px"/></svg>`)}
function ring(d,w,p,col,start=-90,span=360){const r=(d-w)/2,c=2*Math.PI*r,len=c*span/360;return `<svg width="${d}" height="${d}" viewBox="0 0 ${d} ${d}" style="transform:rotate(${start}deg)"><circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="var(--div)" stroke-width="${w}" stroke-dasharray="${len} ${c}" stroke-linecap="round"/><circle cx="${d/2}" cy="${d/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="${len*p} ${c}" stroke-linecap="round"/></svg>`}

function bindSliders(){document.querySelectorAll('[data-slider]').forEach(el=>{const k=el.querySelector('.knob');let sx=null,max=0;
 const down=e=>{sx=e.clientX;max=el.clientWidth-56;k.style.transition='none';el.setPointerCapture(e.pointerId)};
 const move=e=>{if(sx==null)return;const dx=Math.max(0,Math.min(max,e.clientX-sx));k.style.transform=`translateX(${dx}px)`};
 const up=e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;k.style.transition='transform .2s';if(dx>max*.75){k.style.transform=`translateX(${max}px)`;setTimeout(()=>doAct(el.dataset.slider),180)}else k.style.transform='translateX(0)'};
 el.addEventListener('pointerdown',down);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
 el.addEventListener('click',e=>{if(e.detail===0)doAct(el.dataset.slider)});});}
function doAct(a){if(a.startsWith('toast:')){toast(a.slice(6));return render(true)}if(a.startsWith('back-toast:')){toast(a.slice(11));return go('back')}
 if(a==='addRec'){const k=Math.round(foods.reduce((s,f,i)=>s+f[1]*st.portions[i],0));return addMeal(k,'боул с курицей')}
 if(a==='addRecipe')return addMeal(480,'лосось со спаржей');
 if(a==='startW')return startWorkout('Теннис');if(a==='invite'){st.inv++;toast('Ссылка-приглашение скопирована');return render(true)}}
function startWorkout(sp){st.workout={sport:sp,t:0,hr:96,paused:false};st.stack.push('live');render();clearInterval(liveT);liveT=setInterval(()=>{const w=st.workout;if(!w||w.paused)return;w.t+=1;w.hr=Math.max(90,Math.min(165,w.hr+Math.round(Math.random()*6-2.4)));if(st.stack[st.stack.length-1]==='live'){const m=Math.floor(w.t/60),s=w.t%60;const a=$('#wt'),b=$('#whr');if(a)a.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(b)b.textContent=w.hr;if(w.t%5==0)render(true)}},1000)}

// events
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-go],[data-tab],[data-pa]');if(!t)return;const d=t.dataset;
 if(d.tg){st.tg[d.tg]=st.tg[d.tg]?0:1;if(d.tg==='rank')st.showMe=!!st.tg.rank;t.classList.toggle('on');return}
 if(d.multi!==undefined){t.classList.toggle('on');return}
 if(d.seg!==undefined){t.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));t.classList.add('on');return}
 if(d.slot){st.chat.push({me:1,t:d.slot+' подходит',h:tm()},{t:'Записала на '+d.slot.toLowerCase()+'. Напомню накануне',h:tm()});return render(true)}
 if(d.send!==undefined){const m=$('#msg');if(!m.value.trim())return;st.chat.push({me:1,t:m.value.trim(),h:tm()});setTimeout(()=>{st.chat.push({t:'Приняла, отвечу в течение часа',h:tm()});if(st.stack.at(-1)==='manager')render(true)},900);return render(true)}
 if(d.confirm!==undefined){if(t.dataset.armed){toast('В прототипе удаление отключено');t.dataset.armed='';t.textContent='Удалить аккаунт и данные';return}t.dataset.armed='1';t.textContent='Нажми ещё раз, чтобы подтвердить';return}
 if(d.addw){st.water=Math.min(st.water+d.addw/1000,3);toast('+'+d.addw+' мл');return render(true)}
 if(d.start)return startWorkout(d.start);
 if(d.case){st.caseAns[st.caseStep]=d.case;st.caseStep++;if(st.caseStep===2)st.answered.dry=d.case;return render(true)}
 if(d.toast){toast(d.toast);return}
 if(d.go==='toast'){toast('Архив придёт на почту в течение часа');return}
 if(d.go==='check'){st.chk=0;clearInterval(chkT);chkT=setInterval(()=>{st.chk=Math.min(st.chk+4,120);if(st.stack.at(-1)==='check')render(true);if(st.chk>=120){clearInterval(chkT);toast('Проверка завершена · сохранено')}},1000)}
 if(d.tab){st.tab=d.tab;st.stack=[];closeLayer();return render()}
 if(d.plus!==undefined)return sheet();
 if(d.close!==undefined)return closeLayer();
 if(d.sgo){closeLayer();if(d.sgo==='water')return water();if(d.sgo==='addfood')return addFoodSheet();return go(d.sgo)}
 if(d.go){if(d.go==='addfood')return addFoodSheet();if(d.go==='nutrition-tab'||d.go==='activity-tab'){clearInterval(liveT)}return go(d.go)}
 if(d.ans){const [id,a]=d.ans.split('|');st.answered[id]=a;toast('Ответ сохранён — Норма учтёт');return render(true)}
 if(d.pa){const p=st.plan[+d.pa];const [k,v]=p.a.split(':');if(k==='food')return addFoodSheet();if(k==='sport'){st.pickPlan={sport:v,t:p.t,sub:p.sub,coach:p.coach};return go('pick')}return go(v)}
 if(d.done){const i=+d.done;st.plan[i].s='done';st.plan[i].sub=st.plan[i].sub.replace(/^.*?·/, tm()+' · по факту ·');const n=st.plan.findIndex((p,j)=>j>i&&p.s==='next');if(n>0)st.plan[n].s='now';toast('Отмечено');return render(true)}
 if(d.water!==undefined)return water();
 if(d.hrv){hrvP=d.hrv;return render(true)}
 if(d.sp){sp=d.sp;so=0;return render(true)}
 if(d.so){so=Math.max(0,so+(+d.so));return render(true)}
 if(d.por){const [i,v]=d.por.split('|');st.portions[i]=Math.max(0,st.portions[i]+(+v));return render(true)}
 if(d.addman!==undefined)return addMeal(218,'творог 5%, 180 г');
 if(d.sport)return startWorkout(d.sport);
 if(d.pause!==undefined){st.workout.paused=!st.workout.paused;return render(true)}
 if(d.finish!==undefined){clearInterval(liveT);st.stack[st.stack.length-1]='summary';return render()}
 if(d.showme!==undefined){st.showMe=!st.showMe;return render(true)}
 if(d.like){st.liked[d.like]=!st.liked[d.like];return render(true)}
 if(d.theme){st.theme=d.theme;save();applyTheme();return render(true)}
 if(d.join!==undefined){t.textContent='Вы в группе';t.classList.add('on');return}
 if(d.chip!==undefined){t.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));t.classList.add('on');return}
 if(d.backToast){toast(d.backToast);return go('back')}
 if(d.share!==undefined)return toast('Карточка отчёта готова к отправке');
});
document.addEventListener('input',e=>{if(e.target.id==='portion'){const g=+e.target.value;const p=e.target.parentNode;p.querySelector('.num').innerHTML=g+'<span class="h3 c2"> г</span>';p.querySelector('.cap:last-of-type').textContent=Math.round(g*1.21)+' ккал · Б '+Math.round(g*.17)+' · Ж '+Math.round(g*.05)+' · У '+Math.round(g*.03)}});
// live pulse on Today
setInterval(()=>{const h=$('#hr');if(h){h.textContent=56+Math.round(Math.random()*5);const l=$('#live');if(l){l.style.opacity=l.style.opacity=='0.3'?'1':'0.3'}}},1500);
// grain
(function(){const c=$('#grain');const w=256,h=256;c.width=w;c.height=h;c.style.width='100%';c.style.height='100%';c.style.imageRendering='pixelated';const x=c.getContext('2d'),d=x.createImageData(w,h);for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()-.5)*200;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}x.putImageData(d,0,0);const u=c.toDataURL();c.remove();const g=document.createElement('div');g.className='grain';g.style.backgroundImage=`url(${u})`;g.style.backgroundSize='128px';document.querySelector('.bg').after(g)})();
applyTheme();render();
</script>
